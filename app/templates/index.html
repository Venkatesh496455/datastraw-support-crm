<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Datastraw Support CRM</title>
<script>
  if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#E7F1EF', 100: '#C3DCD7', 300: '#5F9C91',
            600: '#0F5D53', 700: '#0B4B44', 800: '#0D423B', 900: '#062F2A', 950: '#041F1B',
          },
          sand: { 50: '#F6F5F1', 100: '#EEEBE3', 200: '#DEDACD', 600: '#8A8577', 700: '#6B6759' },
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          display: ['"Space Grotesk"', 'ui-sans-serif', 'system-ui'],
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui; }
  .font-display { font-family: 'Space Grotesk', ui-sans-serif, system-ui; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .enter { animation: fadeSlideIn 0.35s ease-out both; }
  @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
  *, *::before, *::after { transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }
</style>
<script src="/static/app.js"></script>
</head>
<body class="bg-sand-50 dark:bg-brand-950 min-h-screen">

<header class="bg-brand-700 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-brand-600 flex items-center justify-center text-sand-50 font-display font-semibold text-sm">DS</div>
      <div>
        <h1 class="text-xl font-display font-semibold text-white">Support tickets</h1>
        <p class="text-sm text-brand-100">Datastraw customer support CRM</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="themeToggle" aria-label="Toggle dark mode" class="w-9 h-9 rounded-lg flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 transition">
        <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m8.25-9H18.5m-13 0H3.75m14.478-6.228-1.06 1.06M6.343 17.657l-1.06 1.06m12.374 0-1.06-1.06M6.343 6.343l-1.06-1.06M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z"/></svg>
        <svg class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
      </button>
      <a href="/new" class="bg-amber-500 hover:bg-amber-600 text-brand-900 text-sm font-medium px-4 py-2.5 rounded-lg transition">
        + New ticket
      </a>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">

  <!-- Stat cards -->
  <div id="statCards" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
    <div class="bg-white dark:bg-brand-900 border border-sand-200 dark:border-brand-800 rounded-xl p-4 hover:shadow-sm transition-shadow">
      <div class="flex items-center gap-2 text-stone-400 dark:text-sand-500 text-xs font-medium mb-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
        TOTAL
      </div>
      <div id="statTotal" class="text-2xl font-display font-semibold text-stone-900 dark:text-sand-50">-</div>
    </div>
    <div class="bg-white dark:bg-brand-900 border border-sand-200 dark:border-brand-800 rounded-xl p-4 hover:shadow-sm transition-shadow">
      <div class="flex items-center gap-2 text-brand-600 dark:text-brand-300 text-xs font-medium mb-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
        OPEN
      </div>
      <div id="statOpen" class="text-2xl font-display font-semibold text-stone-900 dark:text-sand-50">-</div>
    </div>
    <div class="bg-white dark:bg-brand-900 border border-sand-200 dark:border-brand-800 rounded-xl p-4 hover:shadow-sm transition-shadow">
      <div class="flex items-center gap-2 text-amber-600 dark:text-amber-400 text-xs font-medium mb-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
        IN PROGRESS
      </div>
      <div id="statProgress" class="text-2xl font-display font-semibold text-stone-900 dark:text-sand-50">-</div>
    </div>
    <div class="bg-white dark:bg-brand-900 border border-sand-200 dark:border-brand-800 rounded-xl p-4 hover:shadow-sm transition-shadow">
      <div class="flex items-center gap-2 text-stone-400 dark:text-sand-500 text-xs font-medium mb-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
        CLOSED
      </div>
      <div id="statClosed" class="text-2xl font-display font-semibold text-stone-900 dark:text-sand-50">-</div>
    </div>
  </div>

  <!-- Search & Filters -->
  <div class="bg-white dark:bg-brand-900 border border-sand-200 dark:border-brand-800 rounded-xl p-4 mb-6 flex flex-col sm:flex-row gap-3">
    <div class="relative flex-1">
      <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 dark:text-sand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
      <input
        id="searchInput"
        type="text"
        placeholder="Search by name, email, ID, or keyword..."
        class="w-full border border-stone-300 dark:border-brand-700 dark:bg-brand-900 dark:text-sand-100 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-300"
      />
    </div>
    <select id="statusFilter" class="border border-stone-300 dark:border-brand-700 dark:bg-brand-900 dark:text-sand-100 rounded-lg px-3 py-2 text-sm">
      <option value="">All Statuses</option>
      <option value="Open">Open</option>
      <option value="In Progress">In Progress</option>
      <option value="Closed">Closed</option>
    </select>
    <select id="priorityFilter" class="border border-stone-300 dark:border-brand-700 dark:bg-brand-900 dark:text-sand-100 rounded-lg px-3 py-2 text-sm">
      <option value="">All Priorities</option>
      <option value="Urgent">Urgent</option>
      <option value="High">High</option>
      <option value="Normal">Normal</option>
      <option value="Low">Low</option>
    </select>
    <select id="sortSelect" class="border border-stone-300 dark:border-brand-700 dark:bg-brand-900 dark:text-sand-100 rounded-lg px-3 py-2 text-sm">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="priority">By priority</option>
    </select>
  </div>

  <div id="stats" class="text-sm text-stone-500 dark:text-sand-400 mb-3"></div>

  <!-- Ticket table -->
  <div class="bg-white dark:bg-brand-900 border border-sand-200 dark:border-brand-800 rounded-xl overflow-hidden hover:shadow-sm transition-shadow">
    <table class="w-full text-sm">
      <thead class="bg-sand-100 dark:bg-brand-800 border-b border-sand-200 dark:border-brand-700 text-stone-500 dark:text-sand-400 text-left">
        <tr>
          <th class="px-4 py-3 font-medium">ID</th>
          <th class="px-4 py-3 font-medium">Customer</th>
          <th class="px-4 py-3 font-medium">Subject</th>
          <th class="px-4 py-3 font-medium">Priority</th>
          <th class="px-4 py-3 font-medium">Status</th>
          <th class="px-4 py-3 font-medium">Created</th>
        </tr>
      </thead>
      <tbody id="ticketBody" class="divide-y divide-stone-100 dark:divide-brand-800">
        <tr><td colspan="6" class="px-4 py-3"><div class="h-4 bg-sand-100 dark:bg-brand-800 rounded animate-pulse w-3/4"></div></td></tr>
        <tr><td colspan="6" class="px-4 py-3"><div class="h-4 bg-sand-100 dark:bg-brand-800 rounded animate-pulse w-2/3"></div></td></tr>
        <tr><td colspan="6" class="px-4 py-3"><div class="h-4 bg-sand-100 dark:bg-brand-800 rounded animate-pulse w-1/2"></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="hidden text-center py-16 px-6">
      <svg class="w-12 h-12 mx-auto mb-3 text-stone-300 dark:text-brand-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5 7.5 3h9L21 7.5m-18 0v10.5A2.25 2.25 0 0 0 5.25 20.25h13.5A2.25 2.25 0 0 0 21 18V7.5m-18 0h18M9 12h6"/></svg>
      <p id="emptyTitle" class="text-stone-600 dark:text-sand-300 font-medium mb-1">No tickets found</p>
      <p id="emptySubtitle" class="text-sm text-stone-400 dark:text-sand-500 mb-4">Try adjusting your search or filters.</p>
      <a id="emptyCta" href="/new" class="hidden inline-block bg-brand-700 hover:bg-brand-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
        Create your first ticket
      </a>
    </div>
  </div>
</main>

<script>
const body = document.getElementById("ticketBody");
const emptyState = document.getElementById("emptyState");
const emptyTitle = document.getElementById("emptyTitle");
const emptySubtitle = document.getElementById("emptySubtitle");
const emptyCta = document.getElementById("emptyCta");
const stats = document.getElementById("stats");
const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");
const priorityFilter = document.getElementById("priorityFilter");
const sortSelect = document.getElementById("sortSelect");

let debounceTimer;
let grandTotal = null;

document.getElementById("themeToggle").addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  localStorage.theme = document.documentElement.classList.contains("dark") ? "dark" : "light";
});

async function loadStats() {
  const res = await fetch("/api/tickets");
  const all = await res.json();
  grandTotal = all.length;
  document.getElementById("statTotal").textContent = all.length;
  document.getElementById("statOpen").textContent = all.filter(t => t.status === "Open").length;
  document.getElementById("statProgress").textContent = all.filter(t => t.status === "In Progress").length;
  document.getElementById("statClosed").textContent = all.filter(t => t.status === "Closed").length;
}

async function loadTickets() {
  const hasFilters = !!(searchInput.value.trim() || statusFilter.value || priorityFilter.value);

  const params = new URLSearchParams();
  if (searchInput.value.trim()) params.set("search", searchInput.value.trim());
  if (statusFilter.value) params.set("status", statusFilter.value);
  if (priorityFilter.value) params.set("priority", priorityFilter.value);
  params.set("sort", sortSelect.value);

  const res = await fetch(`/api/tickets?${params.toString()}`);
  const tickets = await res.json();

  body.innerHTML = "";
  if (tickets.length === 0) {
    emptyState.classList.remove("hidden");
    if (!hasFilters && grandTotal === 0) {
      emptyTitle.textContent = "No tickets yet";
      emptySubtitle.textContent = "Create your first support ticket to get started.";
      emptyCta.classList.remove("hidden");
    } else {
      emptyTitle.textContent = "No tickets match your filters";
      emptySubtitle.textContent = "Try a different search term or clear your filters.";
      emptyCta.classList.add("hidden");
    }
  } else {
    emptyState.classList.add("hidden");
    let i = 0;
    for (const t of tickets) {
      const stale = isStale(t.created_at, t.status);
      const initials = t.customer_name.trim().split(/\s+/).map(p => p[0]).slice(0, 2).join("").toUpperCase();
      const row = document.createElement("tr");
      row.className = "enter hover:bg-sand-100 dark:hover:bg-brand-800 cursor-pointer transition" + (stale ? " bg-red-50/40" : "");
      row.style.animationDelay = `${Math.min(i * 30, 300)}ms`;
      i++;
      row.onclick = () => (window.location.href = `/ticket/${t.ticket_id}`);
      row.innerHTML = `
        <td class="px-4 py-3 font-mono text-xs text-stone-500 dark:text-sand-400">${t.ticket_id}</td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-full bg-brand-100 dark:bg-brand-800 text-brand-700 dark:text-brand-200 text-xs font-semibold flex items-center justify-center shrink-0">${initials}</div>
            <span class="font-medium text-stone-800 dark:text-sand-100">${escapeHtml(t.customer_name)}</span>
          </div>
        </td>
        <td class="px-4 py-3 text-stone-600 dark:text-sand-300">${escapeHtml(t.subject)}</td>
        <td class="px-4 py-3">${priorityBadge(t.priority)}</td>
        <td class="px-4 py-3">
          ${statusBadge(t.status)}
          ${stale ? '<span class="ml-1 text-xs text-red-500" title="Open 2+ days">stale</span>' : ""}
        </td>
        <td class="px-4 py-3 text-stone-500 dark:text-sand-400">${formatDate(t.created_at)}</td>
      `;
      body.appendChild(row);
    }
  }

  stats.textContent = `${tickets.length} ticket${tickets.length !== 1 ? "s" : ""} shown`;
}

searchInput.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadTickets, 250); // debounced live search
});
statusFilter.addEventListener("change", loadTickets);
priorityFilter.addEventListener("change", loadTickets);
sortSelect.addEventListener("change", loadTickets);

loadStats();
loadTickets();
</script>

</body>
</html>
