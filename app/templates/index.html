<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Datastraw Support CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-semibold text-slate-900">Support Tickets</h1>
      <p class="text-sm text-slate-500">Datastraw Customer Support CRM</p>
    </div>
    <a href="/new" class="bg-slate-900 hover:bg-slate-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition">
      + New Ticket
    </a>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">

  <!-- Search & Filters -->
  <div class="bg-white border border-slate-200 rounded-xl p-4 mb-6 flex flex-col sm:flex-row gap-3">
    <input
      id="searchInput"
      type="text"
      placeholder="Search by name, email, ID, or keyword..."
      class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
    />
    <select id="statusFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
      <option value="">All Statuses</option>
      <option value="Open">Open</option>
      <option value="In Progress">In Progress</option>
      <option value="Closed">Closed</option>
    </select>
    <select id="priorityFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
      <option value="">All Priorities</option>
      <option value="Urgent">Urgent</option>
      <option value="High">High</option>
      <option value="Normal">Normal</option>
      <option value="Low">Low</option>
    </select>
    <select id="sortSelect" class="border border-slate-300 rounded-lg px-3 py-2 text-sm">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="priority">By priority</option>
    </select>
  </div>

  <div id="stats" class="text-sm text-slate-500 mb-3"></div>

  <!-- Ticket table -->
  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-left">
        <tr>
          <th class="px-4 py-3 font-medium">ID</th>
          <th class="px-4 py-3 font-medium">Customer</th>
          <th class="px-4 py-3 font-medium">Subject</th>
          <th class="px-4 py-3 font-medium">Priority</th>
          <th class="px-4 py-3 font-medium">Status</th>
          <th class="px-4 py-3 font-medium">Created</th>
        </tr>
      </thead>
      <tbody id="ticketBody" class="divide-y divide-slate-100"></tbody>
    </table>
    <div id="emptyState" class="hidden text-center py-16 text-slate-400">
      No tickets found.
    </div>
  </div>
</main>

<script>
const body = document.getElementById("ticketBody");
const emptyState = document.getElementById("emptyState");
const stats = document.getElementById("stats");
const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");
const priorityFilter = document.getElementById("priorityFilter");
const sortSelect = document.getElementById("sortSelect");

let debounceTimer;

async function loadTickets() {
  const params = new URLSearchParams();
  if (searchInput.value.trim()) params.set("search", searchInput.value.trim());
  if (statusFilter.value) params.set("status", statusFilter.value);
  if (priorityFilter.value) params.set("priority", priorityFilter.value);
  params.set("sort", sortSelect.value);

  const res = await fetch(`/api/tickets?${params.toString()}`);
  const tickets = await res.json();

  body.innerHTML = "";
  if (tickets.length === 0) {
    emptyState.classList.remove("hidden");
  } else {
    emptyState.classList.add("hidden");
    for (const t of tickets) {
      const stale = isStale(t.created_at, t.status);
      const row = document.createElement("tr");
      row.className = "hover:bg-slate-50 cursor-pointer transition" + (stale ? " bg-red-50/40" : "");
      row.onclick = () => (window.location.href = `/ticket/${t.ticket_id}`);
      row.innerHTML = `
        <td class="px-4 py-3 font-mono text-xs text-slate-500">${t.ticket_id}</td>
        <td class="px-4 py-3 font-medium text-slate-800">${escapeHtml(t.customer_name)}</td>
        <td class="px-4 py-3 text-slate-600">${escapeHtml(t.subject)}</td>
        <td class="px-4 py-3">${priorityBadge(t.priority)}</td>
        <td class="px-4 py-3">
          ${statusBadge(t.status)}
          ${stale ? '<span class="ml-1 text-xs text-red-500" title="Open 2+ days">⏱ stale</span>' : ""}
        </td>
        <td class="px-4 py-3 text-slate-500">${formatDate(t.created_at)}</td>
      `;
      body.appendChild(row);
    }
  }

  stats.textContent = `${tickets.length} ticket${tickets.length !== 1 ? "s" : ""} shown`;
}

searchInput.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadTickets, 250); // debounced live search
});
statusFilter.addEventListener("change", loadTickets);
priorityFilter.addEventListener("change", loadTickets);
sortSelect.addEventListener("change", loadTickets);

loadTickets();
</script>

</body>
</html>
